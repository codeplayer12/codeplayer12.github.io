<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0d0b">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="topbar-brand" href="{{ '/' | relative_url }}"><span class="prompt">$</span> {{ site.title }}</a>
    <button class="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">☰</button>
  </header>

  <div class="shell">
    {% include sidebar.html %}
    <main id="main" class="content">
      {{ content }}
      <footer class="footer">
        <span>© {{ site.time | date: '%Y' }} {{ site.author }}</span>
        <span class="dim">— built with Jekyll on GitHub Pages</span>
      </footer>
    </main>
  </div>

  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
